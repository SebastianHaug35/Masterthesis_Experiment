services:
  ma-h1:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: ma-h1:latest
    container_name: ma-h1
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./input:/app/input:ro
      - ./prompts:/app/prompts:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./runs:/app/runs
      - ./results:/app/results
