<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
  </defs>
  <rect width="820" height="620" fill="#fff"/>
  <!-- Stufen -->
  <g font-size="15" text-anchor="middle">
    <rect x="250" y="30" width="300" height="70" rx="10" fill="#1f4e8c"/>
    <text x="400" y="60" fill="#fff" font-weight="bold">Recht der Europäischen Union</text>
    <text x="400" y="82" fill="#dfe8f5" font-size="12">Verträge · Verordnungen · Richtlinien</text>
    <rect x="250" y="140" width="300" height="56" rx="10" fill="#2f5f9e"/>
    <text x="400" y="174" fill="#fff" font-weight="bold">Grundgesetz</text>
    <rect x="250" y="236" width="300" height="70" rx="10" fill="#4a7bbf"/>
    <text x="400" y="266" fill="#fff" font-weight="bold">Bundesrecht</text>
    <text x="400" y="288" fill="#eef3fa" font-size="12">Bundesgesetze · Rechtsverordnungen</text>
    <rect x="250" y="346" width="300" height="70" rx="10" fill="#6e97cf"/>
    <text x="400" y="376" fill="#fff" font-weight="bold">Landesrecht</text>
    <text x="400" y="398" fill="#f3f7fc" font-size="12">Landesverfassung · Landesgesetze · Verordnungen</text>
    <rect x="230" y="456" width="340" height="84" rx="10" fill="#a9c3e6"/>
    <text x="400" y="484" fill="#10294d" font-weight="bold">Regelungen unterhalb des Gesetzes</text>
    <text x="400" y="506" fill="#10294d" font-size="12">z. B. Tarifverträge, Betriebs- und Dienstvereinbarungen,</text>
    <text x="400" y="524" fill="#10294d" font-size="12">Satzungen, interne Richtlinien</text>
  </g>
  <!-- Vorrang -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="400" y1="100" x2="400" y2="138" marker-end="url(#pf)"/>
    <line x1="400" y1="196" x2="400" y2="234" marker-end="url(#pf)"/>
    <line x1="400" y1="306" x2="400" y2="344" marker-end="url(#pf)"/>
    <line x1="400" y1="416" x2="400" y2="454" marker-end="url(#pf)"/>
  </g>
  <g font-size="11" fill="#333">
    <text x="410" y="124">Anwendungsvorrang</text>
    <text x="410" y="335">Bundesrecht bricht Landesrecht</text>
  </g>
  <!-- Richtlinien -->
  <line x1="248" y1="68" x2="212" y2="68" stroke="#c98a14" stroke-width="1.8"/>
  <rect x="20" y="40" width="190" height="56" rx="8" fill="#fff6e6" stroke="#c98a14"/>
  <text x="115" y="64" font-size="13" text-anchor="middle" font-weight="bold" fill="#5a3a00">EU-Richtlinien</text>
  <text x="115" y="82" font-size="11" text-anchor="middle" fill="#5a3a00">müssen umgesetzt werden</text>
  <g stroke="#8a5a00" stroke-width="1.8" fill="none" stroke-dasharray="6 5">
    <path d="M115,96 L115,270 L248,270" marker-end="url(#pg)"/>
    <path d="M115,270 L115,380 L248,380" marker-end="url(#pg)"/>
  </g>
  <text x="126" y="262" font-size="11" fill="#8a5a00">Umsetzung</text>
  <!-- Normen -->
  <rect x="610" y="300" width="190" height="84" rx="8" fill="#fff6e6" stroke="#c98a14"/>
  <text x="705" y="326" font-size="13" text-anchor="middle" font-weight="bold" fill="#5a3a00">Technische Normen</text>
  <text x="705" y="344" font-size="11" text-anchor="middle" fill="#5a3a00">z. B. DIN, VDE, ISO</text>
  <text x="705" y="362" font-size="11" text-anchor="middle" fill="#5a3a00">privat erstellt,</text>
  <text x="705" y="376" font-size="11" text-anchor="middle" fill="#5a3a00">urheberrechtlich geschützt</text>
  <g stroke="#8a5a00" stroke-width="1.8" fill="none" stroke-dasharray="6 5">
    <path d="M552,271 L705,271 L705,298" marker-end="url(#pg)"/>
    <path d="M552,381 L608,381" marker-end="url(#pg)"/>
  </g>
  <text x="590" y="262" font-size="11" fill="#8a5a00">Verweis</text>
  <!-- Legende -->
  <g font-size="11" fill="#444">
    <line x1="30" y1="585" x2="70" y2="585" stroke="#333" stroke-width="2"/><text x="78" y="589">Rangfolge: höhere Ebene geht vor</text>
    <line x1="330" y1="585" x2="370" y2="585" stroke="#8a5a00" stroke-width="1.8" stroke-dasharray="6 5"/><text x="378" y="589">lose Abhängigkeit (Umsetzung, Verweis)</text>
  </g>
</svg>
